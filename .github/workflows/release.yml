name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cctx-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: cctx-linux-x86_64-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cctx-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cctx-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cctx-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/cctx ${{ matrix.artifact }}
          strip ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target\${{ matrix.target }}\release\cctx.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cctx-linux-x86_64/cctx-linux-x86_64
            cctx-linux-x86_64-musl/cctx-linux-x86_64-musl
            cctx-windows-x86_64.exe/cctx-windows-x86_64.exe
            cctx-macos-x86_64/cctx-macos-x86_64
            cctx-macos-aarch64/cctx-macos-aarch64
          body: |
            ## cctx ${{ github.ref_name }}

            Manage Claude Code accounts and settings contexts without copying credentials.

            ### Installation

            Download the binary for your platform, make it executable and put it on your PATH:

            - **Linux (x86_64)**: `cctx-linux-x86_64`
            - **Linux (x86_64, static)**: `cctx-linux-x86_64-musl`
            - **Windows (x86_64)**: `cctx-windows-x86_64.exe`
            - **macOS (Intel)**: `cctx-macos-x86_64`
            - **macOS (Apple Silicon)**: `cctx-macos-aarch64`

            ```sh
            chmod +x cctx-*
            sudo mv cctx-* /usr/local/bin/cctx
            ```

            ### Usage

            ```sh
            eval "$(cctx --shell-init bash)"   # fish: cctx --shell-init fish | source
            cctx --add-account secondary       # empty profile; log in with --login
            cctx --account secondary --login
            cctx --account secondary           # select for this shell, then run claude
            cctx -n work && cctx work          # save and activate a settings context
            ```

            See the [README](https://github.com/nwiizo/cctx) for details.
          draft: false
          prerelease: false
