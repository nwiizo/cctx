[package]
name = "cctx"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["nwiizo <syu.m.5151@gmail.com>"]
description = "Manage Claude Code accounts and settings contexts without copying credentials"
license = "MIT"
repository = "https://github.com/nwiizo/cctx"
homepage = "https://github.com/nwiizo/cctx"
readme = "README.md"
keywords = ["claude", "claude-code", "context", "cli", "config"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/shell", "/README.md", "/LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
colored = "2.1"
tempfile = "3.20"

[dev-dependencies]
which = "6.0"
